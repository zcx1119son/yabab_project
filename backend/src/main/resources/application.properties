spring.application.name=yabab

spring.config.import=optional:file:./.env

# port
server.port=18090

# DB (민감 정보 치환 완료)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.drvier-class-name=${DB_DRIVER_CLASS_NAME}

# mybatis (비민감 정보 유지)
mybatis.type-aliases-package=fs.human.yabab.*.vo
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JSON (비민감 정보 유지)
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# email verification (민감 정보 치환 완료)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# API Keys (민감 정보 치환 완료)
service-key=${SERVICE_KEY}
kakao.map.api.key=${KAKAO_MAP_API_KEY}
api.nts-biz-check-url=${BIZ_CHECK_URL}

kakao.rest.api.key=${KAKAO_REST_API_KEY}
kakao.redirect.uri=${KAKAO_REDIRECT_URI}
kakao.token.url=https://kauth.kakao.com/oauth/token
kakao.user.info.url=https://kapi.kakao.com/v2/user/me

# File Upload (비민감 정보 유지)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB 
upload.uploads.image.dir=uploads

# Logging (비민감 정보 유지)
logging.level.root=INFO
logging.level.fs.human.yabab.Reserve.dao=DEBUG 
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.apache.ibatis=DEBUG